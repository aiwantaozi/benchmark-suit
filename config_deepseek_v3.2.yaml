model: "deepseek-ai/DeepSeek-V3.2"
run_baseline: false
baseline_args: ""
health_check:
  init_delay: 180
  timeout: 1800 # 30 minutes
  interval: 5.0

# Define benchmark cases
test_cases:
  sharegpt:
    type: sharegpt
    num_prompts: 1000
    dataset_path: "ShareGPT_V3_unfiltered_cleaned_split.json"

  random_32k:
    type: random
    input_len: 32000
    output_len: 100
    num_prompts: 100
    seed: 42

  random_4k:
    type: random
    input_len: 4000
    output_len: 200
    num_prompts: 500
    seed: 42

  random_2k:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42

  random_128:
    type: random
    input_len: 128
    output_len: 4
    num_prompts: 1000
    seed: 42

  random_2k_output:
    type: random
    input_len: 1000
    output_len: 2000
    num_prompts: 100
    seed: 42

  random_2k_thinking:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42
    args: '--extra_body={"chat_template_kwargs": {"thinking": True}}'

# Engine test configurations
runs:
  - name: "vllm-baseline"
    engine: "vllm"
    conda_env: "vllm"
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3 --tool-call-parser deepseek_v32 --enable-auto-tool-choice"
    # result_filename defaults to {run_name}_{test_case_name}.json
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

  - name: "vllm-second-baseline"
    engine: "vllm"
    conda_env: "vllm"
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    # result_filename defaults to {run_name}_{test_case_name}.json
    test_cases:
      # - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

  - name: "vllm-without-tool"
    engine: "vllm"
    conda_env: "vllm"
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    test_cases:
      - sharegpt

  # - name: "vllm-only-tp" # Error default chat template is no longer allowed, so you must provide a chat template if the tokenizer does not define one.
  #   engine: "vllm"
  #   conda_env: "vllm"
  #   args: "-tp 8"
  #   test_cases:
  #     - sharegpt

  - name: "vllm-without-tool-reason"
    engine: "vllm"
    conda_env: "vllm"
    args: "-tp 8 --tokenizer-mode deepseek_v32"
    test_cases:
      - sharegpt

  - name: "sglang-baseline"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --chat-template ./tool_chat_template_deepseekv32.jinja"
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

  - name: "trtllm-baseline"
    engine: "trtllm"
    conda_env: "trtllm"
    args: "--tp_size 8 --tokens_per_block 64"
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

# MTP TODO:yaml带引号非法
#speculative decoding with mpt
  - name: "vllm-speculative-decoding-mtp"
    engine: "vllm"
    conda_env: "vllm"
    args: >
      -tp 8
      --tokenizer-mode deepseek_v32
      --reasoning-parser deepseek_v3
      --speculative-config {"method":"mtp","num_speculative_tokens":1}
    test_cases:
      - sharegpt

  - name: "vllm-speculative-decoding-mtp-step3"
    engine: "vllm"
    conda_env: "vllm"
    args: >
      -tp 8
      --tokenizer-mode deepseek_v32
      --reasoning-parser deepseek_v3
      --speculative-config {"method":"mtp","num_speculative_tokens":3}
    test_cases:
      - sharegpt

# Priority: low
  - name: "sglang-speculative-decoding-mtp"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --speculative-algorithm EAGLE --speculative-num-steps 1 --speculative-eagle-topk 1 --speculative-num-draft-tokens 2"
    test_cases:
      - sharegpt

  - name: "sglang-speculative-decoding-mtp-step3"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4"
    test_cases:
      - sharegpt

# speculative-decoding with eagle variants
  - name: "sglang-speculative-decoding-eagle3-steps1"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --chat-template ./tool_chat_template_deepseekv32.jinja --speculative-algorithm EAGLE3 --speculative-num-steps 1 --speculative-eagle-topk 1 --speculative-num-draft-tokens 2"
    test_cases:
      - sharegpt

# Priority: low
  # - name: "sglang-speculative-decoding-eagle3-steps3"
  #   engine: "sglang"
  #   conda_env: "sglang"
  #   args: "--tensor-parallel-size 8 --speculative-algorithm EAGLE3 --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4"
  #   test_cases:
  #     - sharegpt

  - name: "trt-speculative-decoding-mtp"
    engine: "trtllm"
    conda_env: "trtllm"
    args: >
      --tp_size 8
      --tokens_per_block 64
      --spec_decode_algo MTP
      --spec_decode_max_draft_len 2
    test_cases:
      - sharegpt

# Non-Sequential Attention (NSA), vllm don't support this yet
  - name: "sglang-context-parallel"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --chat-template ./tool_chat_template_deepseekv32.jinja --enable-nsa-prefill-context-parallel"
    test_cases:
      - random_32k

# DeepGEMM
  - name: "sglang-deepgemm-diable" # run before test: python3 -m sglang.compile_deep_gemm --model deepseek-ai/DeepSeek-V3 -tp 8 --trust-remote-code
    engine: "sglang"
    conda_env: "sglang"
    envs:
      SGLANG_ENABLE_JIT_DEEPGEMM: "0"
    args: "--tensor-parallel-size 8 --chat-template ./tool_chat_template_deepseekv32.jinja"
    test_cases:
      - sharegpt
  
  - name: "vllm-deepgemm-disable"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      VLLM_USE_DEEP_GEMM: "0"
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    test_cases:
      - sharegpt

  - name: "trt-deepgemm-disable"
    engine: "trtllm"
    conda_env: "trtllm"
    envs:
      TRTLLM_DG_ENABLED: "0"
    args: >
      --tp_size 8
      --tokens_per_block 64
      --spec_decode_algo MTP
      --spec_decode_max_draft_len N
    test_cases:
      - sharegpt


