model: "deepseek-ai/DeepSeek-V3.2"
run_baseline: false
baseline_args: "--max-model-len 32768"
health_check:
  timeout: 60
  interval: 2.0

# Define benchmark cases
test_cases:
  sharegpt:
    type: sharegpt
    num_prompts: 1000
    dataset_path: "ShareGPT_V3_unfiltered_cleaned_split.json"

  random_32k:
    type: random
    input_len: 32000
    output_len: 100
    num_prompts: 100
    seed: 42

  random_4k:
    type: random
    input_len: 4000
    output_len: 200
    num_prompts: 500
    seed: 42

  random_2k:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42

  random_128:
    type: random
    input_len: 128
    output_len: 4
    num_prompts: 1000
    seed: 42

  random_2k_output:
    type: random
    input_len: 1000
    output_len: 2000
    num_prompts: 100
    seed: 42

  random_2k_thinking:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42
    args: '--extra_body={"chat_template_kwargs": {"thinking": True}}'

# Engine test configurations
runs:
  - name: "vllm-baseline"
    engine: "vllm"
    conda_env: "vllm"
    args: "--tp 8"
    # result_filename defaults to {run_name}_{test_case_name}.json
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

  - name: "sglang-baseline"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8"
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

  - name: "vllm-thinking"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      VLLM_ATTENTION_BACKEND: "FLASHINFER"
    args: "--tp 8 --max-num-seqs 1024 --max-num-batched-tokens 16384 --max-model-len 32768"
    test_cases:
      - sharegpt
      - random_32k
  
  - name: "vllm-flashinfer"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      VLLM_ATTENTION_BACKEND: "FLASHINFER"
    args: "--tp 8 --max-num-seqs 1024 --max-num-batched-tokens 16384 --max-model-len 32768"
    test_cases:
      - sharegpt
      - random_32k

  - name: "vllm-xformers"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      VLLM_ATTENTION_BACKEND: "XFORMERS"
    args: "--tp 8 --max-num-seqs 512 --max-num-batched-tokens 8192 --gpu-memory-utilization 0.9"
    test_cases:
      - sharegpt

  - name: "sglang-cuda-graph-512"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --cuda-graph-max-bs 512"
    test_cases:
      - sharegpt
  
  - name: "sglang-cuda-graph-256"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --cuda-graph-max-bs 256"
    test_cases:
      - sharegpt

  # - name: "sglang-deepgemm" # TODO: install deepgemm
  #   engine: "sglang"
  #   conda_env: "sglang"
  #   envs:
  #     SGLANG_ENABLE_FLASHINFER_GEMM: true
  #   args: "--tp 8 --cuda-graph-max-bs 256"
  #   test_cases:
  #     - sharegpt

  # - name: "sglang-ep" # resource not enough on 8-GPU machine, need 64-GPUs
  #   engine: "sglang"
  #   conda_env: "sglang"
  #   args: "--tp 8 --cuda-graph-max-bs 256 --ep-size 8"
  #   test_cases:
  #     - sharegpt

  - name: "sglang-context-parallel"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --enable-nsa-prefill-context-parallel"
    test_cases:
      - random_32k

  - name: "sglang-high-mem"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --mem-fraction-static 0.95 --cuda-graph-max-bs 256"
    test_cases:
      - sharegpt

  - name: "sglang-low-mem"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --mem-fraction-static 0.7 --cuda-graph-max-bs 256"
    test_cases:
      - sharegpt

  - name: "sglang-speculative-decoding-eagle2"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --mem-fraction-static 0.7 --cuda-graph-max-bs 256 --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4"
    test_cases:
      - sharegpt

  - name: "sglang-speculative-decoding-eagle3"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --mem-fraction-static 0.7 --cuda-graph-max-bs 256 --speculative-algorithm EAGLE3 --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4"
    test_cases:
      - sharegpt

  


