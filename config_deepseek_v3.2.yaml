model: "deepseek-ai/DeepSeek-V3.2"
run_baseline: false
baseline_args: ""
health_check:
  init_delay: 60
  timeout: 600 # 10 minutes
  interval: 5.0

# Define benchmark cases
test_cases:
  sharegpt:
    type: sharegpt
    num_prompts: 1000
    dataset_path: "ShareGPT_V3_unfiltered_cleaned_split.json"

  random_32k:
    type: random
    input_len: 32000
    output_len: 100
    num_prompts: 100
    seed: 42

  random_4k:
    type: random
    input_len: 4000
    output_len: 200
    num_prompts: 500
    seed: 42

  random_2k:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42

  random_128:
    type: random
    input_len: 128
    output_len: 4
    num_prompts: 1000
    seed: 42

  random_2k_output:
    type: random
    input_len: 1000
    output_len: 2000
    num_prompts: 100
    seed: 42

  random_2k_thinking:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42
    args: '--extra_body={"chat_template_kwargs": {"thinking": True}}'

# Engine test configurations
runs:
  - name: "vllm-baseline"
    engine: "vllm"
    conda_env: "vllm"
    args: "--tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    # result_filename defaults to {run_name}_{test_case_name}.json
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

  - name: "sglang-baseline"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8"
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

# MTP
# speculative decoding with mpt
  - name: "vllm-speculative-decoding-mtp"
    engine: "vllm"
    conda_env: "vllm"
    args: "--tp 8  --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3 --speculative-config='{"method": "deepseek_mtp", "num_speculative_tokens": 1}'"
    test_cases:
      - sharegpt

  - name: "sglang-speculative-decoding-mtp"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --speculative-algorithm EAGLE --speculative-num-steps 1 --speculative-eagle-topk 1 --speculative-num-draft-tokens 2"
    test_cases:
      - sharegpt

# speculative-decoding with eagle variants
  - name: "sglang-speculative-decoding-eagle3-steps1"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --speculative-algorithm EAGLE3 --speculative-num-steps 1 --speculative-eagle-topk 1 --speculative-num-draft-tokens 2"
    test_cases:
      - sharegpt

  - name: "sglang-speculative-decoding-eagle3-steps3"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --speculative-algorithm EAGLE3 --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4"
    test_cases:
      - sharegpt

# Non-Sequential Attention (NSA), vllm don't support this yet
  - name: "sglang-context-parallel"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tp 8 --enable-nsa-prefill-context-parallel"
    test_cases:
      - random_4k
      - random_32k

# DeepGEMM
  - name: "sglang-deepgemm" # run before test: python3 -m sglang.compile_deep_gemm --model deepseek-ai/DeepSeek-V3 --tp 8 --trust-remote-code
    engine: "sglang"
    conda_env: "sglang"
    envs:
      SGLANG_ENABLE_FLASHINFER_GEMM: true
    args: "--tp 8 --cuda-graph-max-bs 256"
    test_cases:
      - sharegpt
  
  - name: "vllm-deepgemm"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      VLLM_USE_DEEP_GEMM: 1
    args: "--tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    test_cases:
      - sharegpt


