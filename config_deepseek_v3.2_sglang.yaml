# Speculative-decoding with eagle variants
  - name: "sglang-speculative-decoding-mtp"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --speculative-algorithm EAGLE --speculative-num-steps 1 --speculative-eagle-topk 1 --speculative-num-draft-tokens 2"
    test_cases:
      - sharegpt

  - name: "sglang-speculative-decoding-mtp-step3"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4"
    test_cases:
      - sharegpt

  - name: "sglang-speculative-decoding-eagle3-steps1"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --chat-template ./tool_chat_template_deepseekv32.jinja --speculative-algorithm EAGLE3 --speculative-num-steps 1 --speculative-eagle-topk 1 --speculative-num-draft-tokens 2"
    test_cases:
      - sharegpt

  - name: "sglang-speculative-decoding-eagle3-steps3"
    engine: "sglang"
    conda_env: "sglang"
    args: "--tensor-parallel-size 8 --speculative-algorithm EAGLE3 --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4"
    test_cases:
      - sharegpt

# DeepGEMM
  - name: "sglang-deepgemm-diable" # run before test: python3 -m sglang.compile_deep_gemm --model deepseek-ai/DeepSeek-V3 -tp 8 --trust-remote-code
    engine: "sglang"
    conda_env: "sglang"
    envs:
      SGLANG_ENABLE_JIT_DEEPGEMM: "0"
    args: "--tensor-parallel-size 8 --chat-template ./tool_chat_template_deepseekv32.jinja"
    test_cases:
      - sharegpt

