model: "Qwen/Qwen3-8B"
run_baseline: true
baseline_args: "--max-model-len 32768"

# Define benchmark cases
test_cases:
  sharegpt:
    type: sharegpt
    num_prompts: 1000
    dataset_path: "ShareGPT_V3_unfiltered_cleaned_split.json"

  random_32k:
    type: random
    input_len: 32000
    output_len: 100
    num_prompts: 100
    seed: 42

  random_4k:
    type: random
    input_len: 4000
    output_len: 200
    num_prompts: 500
    seed: 42

  random_2k:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42

  random_128:
    type: random
    input_len: 128
    output_len: 4
    num_prompts: 1000
    seed: 42

  random_2k_output:
    type: random
    input_len: 1000
    output_len: 2000
    num_prompts: 100
    seed: 42

# Engine test configurations
runs:
  - name: "vllm-baseline"
    engine: "vllm"
    conda_env: "vllm"
    args: ""
    # result_filename defaults to {run_name}_{test_case_name}.json
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output

  - name: "sglang-default"
    engine: "sglang"
    conda_env: "sglang"
    args: ""
    test_cases:
      - sharegpt

  - name: "trtllm-default"
    engine: "trtllm"
    conda_env: "trtllm"
    args: ""
    test_cases:
      - sharegpt
