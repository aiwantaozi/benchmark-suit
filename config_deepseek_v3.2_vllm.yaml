# Attention Backends 
# Sglang: auto selected base on the gpu, FlashAttention 3 default for Hopper Machines, e.g., H100, H200, H20)
# vLLM: auto selected base on gpu and model, FLASHMLA_SPARSE default, Triton backend for FP8 MoE
  - name: "vllm-flashinfer"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      VLLM_ATTENTION_BACKEND: "FLASHINFER"
      HF_HOME: /workspace/gpustack_cache
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    test_cases:
      - sharegpt
      - random_32k

  - name: "vllm-xformers"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      VLLM_ATTENTION_BACKEND: "XFORMERS"
      HF_HOME: /workspace/gpustack_cache
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    test_cases:
      - sharegpt

