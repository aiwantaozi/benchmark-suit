model: "deepseek-ai/DeepSeek-V3.2"
run_baseline: false
baseline_args: ""
health_check:
  init_delay: 180
  timeout: 1800 # 30 minutes
  interval: 5.0

# Define benchmark cases
test_cases:
  
  sharegpt:
    type: sharegpt
    num_prompts: 1000
    dataset_path: "ShareGPT_V3_unfiltered_cleaned_split.json"

  random_32k:
    type: random
    input_len: 32000
    output_len: 100
    num_prompts: 100
    seed: 42

  random_4k:
    type: random
    input_len: 4000
    output_len: 200
    num_prompts: 500
    seed: 42

  random_2k:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42

  random_128:
    type: random
    input_len: 128
    output_len: 4
    num_prompts: 1000
    seed: 42
  
  random_128k:
    type: random
    input_len: 128000
    output_len: 100
    num_prompts: 50
    seed: 42

  random_2k_output:
    type: random
    input_len: 1000
    output_len: 2000
    num_prompts: 100
    seed: 42

  random_2k_thinking:
    type: random
    input_len: 2000
    output_len: 100
    num_prompts: 500
    seed: 42
    args: '--extra_body={"chat_template_kwargs": {"thinking": True}}'

# Engine test configurations
runs:

  # - name: "vllm-only-tp" # Error default chat template is no longer allowed, so you must provide a chat template if the tokenizer does not define one.
  #   engine: "vllm"
  #   conda_env: "vllm"
  #   args: "-tp 8"
  #   test_cases:
  #     - sharegpt

  - name: "vllm-tp-tokenizer-reason"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      HF_HOME: /workspace/gpustack_cache
    # result_filename defaults to {run_name}_{test_case_name}.json
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    test_cases:
      - sharegpt
      # - random_32k
      # - random_4k
      # - random_2k
      # - random_128
      # - random_2k_output
      # - random_128k

  - name: "vllm-tp-tokenizer-reason-max-model-len"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      HF_HOME: /workspace/gpustack_cache
    # result_filename defaults to {run_name}_{test_case_name}.json
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3 --max-model-len 32768"
    test_cases:
      - sharegpt

  - name: "vllm-tool-call"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3 --tool-call-parser deepseek_v32 --enable-auto-tool-choice"
    test_cases:
      - sharegpt

