# Speculative decoding with mpt
  - name: "vllm-speculative-decoding-mtp"
    engine: "vllm"
    conda_env: "vllm"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      -tp 8
      --tokenizer-mode deepseek_v32
      --reasoning-parser deepseek_v3
      --speculative-config {"method":"mtp","num_speculative_tokens":1}
    test_cases:
      - sharegpt

