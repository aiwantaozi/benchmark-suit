  - name: "vllm-dp-ep-pplx" # TODO: install pplx and test
    engine: "vllm"
    conda_env: "vllm"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      --tensor-parallel-size 1
      --tokenizer-mode deepseek_v32
      --reasoning-parser deepseek_v3
      -dp 8
      --enable-expert-parallel
      --all2all-backend pplx
    test_cases:
