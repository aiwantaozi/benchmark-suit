# Low
  # - name: "sglang-official-recommended-tp-dp-reasoning"
  #   engine: "sglang"
  #   conda_env: "sglang"
  #   envs:
  #     HF_HOME: /workspace/gpustack_cache
  #   args: >
  #     --tensor-parallel-size 8
  #     --enable-dp-attention 
  #     --chat-template ./tool_chat_template_deepseekv32.jinja 
  #     --dp 8 
  #     --reasoning-parser deepseek-v3
  #   test_cases:
  #     - sharegpt

  - name: "sglang-official-recommended-tp-dp-reasoning-tool-call"
    engine: "sglang"
    conda_env: "sglang"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      --tensor-parallel-size 8 
      --enable-dp-attention 
      --chat-template ./tool_chat_template_deepseekv32.jinja 
      --dp 8 
      --reasoning-parser deepseek-v3 
      --tool-call-parser deepseekv32
    test_cases:
      - sharegpt

  - name: "sglang-official-tp-dp-cp"
    engine: "sglang"
    conda_env: "sglang"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      --tensor-parallel-size 8
      --enable-dp-attention
      --chat-template ./tool_chat_template_deepseekv32.jinja
      --dp 8
      --enable-nsa-prefill-context-parallel
    test_cases:
      - sharegpt

  - name: "sglang-official-tp-dp-reason-tool-context-length-32k"
    engine: "sglang"
    conda_env: "sglang"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      --tensor-parallel-size 8
      --enable-dp-attention
      --chat-template ./tool_chat_template_deepseekv32.jinja
      --dp 8
      --reasoning-parser deepseek-v3 
      --tool-call-parser deepseekv32
      --context-length=32768
    test_cases:
      - sharegpt

  - name: "sglang-official-tp-dp-context-length-32k-kv-cache-type" # default is fpfloat16
    engine: "sglang"
    conda_env: "sglang"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      --tensor-parallel-size 8
      --enable-dp-attention
      --chat-template ./tool_chat_template_deepseekv32.jinja
      --dp 8
      --reasoning-parser deepseek-v3 
      --tool-call-parser deepseekv32
      --context-length=32768
      --kv-cache-dtype fp8_e4m3
    test_cases:
      - sharegpt

  - name: "sglang-official-tp-dp-context-length-32k-kv-cache-type-fp8" # default is fpfloat16
    engine: "sglang"
    conda_env: "sglang"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      --tensor-parallel-size 8
      --enable-dp-attention
      --chat-template ./tool_chat_template_deepseekv32.jinja
      --dp 8
      --reasoning-parser deepseek-v3 
      --tool-call-parser deepseekv32
      --context-length=32768
      --kv-cache-dtype fp8
    test_cases:
      - sharegpt

# Attention, different backends
  - name: "sglang-official-tp-dp-context-length-32k-backend-flashmla-sparse-kv"
    engine: "sglang"
    conda_env: "sglang"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      --tensor-parallel-size 8
      --enable-dp-attention
      --chat-template ./tool_chat_template_deepseekv32.jinja
      --dp 8
      --reasoning-parser deepseek-v3 
      --tool-call-parser deepseekv32
      --context-length=32768
      --attention-backend nsa
      --nsa-prefill-backend flashmla_sparse
      --nsa-decode-backend flashmla_kv
    test_cases:
      - sharegpt

  - name: "sglang-official-tp-dp-context-length-32k-backend-fa3-fa3"
    engine: "sglang"
    conda_env: "sglang"
    envs:
      HF_HOME: /workspace/gpustack_cache
    args: >
      --tensor-parallel-size 8
      --enable-dp-attention
      --chat-template ./tool_chat_template_deepseekv32.jinja
      --dp 8
      --reasoning-parser deepseek-v3 
      --tool-call-parser deepseekv32
      --context-length=32768
      --attention-backend nsa
      --nsa-prefill-backend fa3
      --nsa-decode-backend fa3
    test_cases:
      # - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_128k
      - random_2k_output

