model: "deepseek-ai/DeepSeek-V3.2"
run_baseline: false
baseline_args: ""
health_check:
  init_delay: 60
  timeout: 600 # 10 minutes
  interval: 5.0

# Define benchmark cases
test_cases:
  sharegpt:
    type: sharegpt
    num_prompts: 1000
    dataset_path: "ShareGPT_V3_unfiltered_cleaned_split.json"

  random_128:
    type: random
    input_len: 128
    output_len: 4
    num_prompts: 1000
    seed: 42

# Engine test configurations
runs:
  - name: "vllm-baseline"
    engine: "vllm"
    conda_env: "vllm"
    args: "-tp 8 --tokenizer-mode deepseek_v32 --reasoning-parser deepseek_v3"
    # result_filename defaults to {run_name}_{test_case_name}.json
    test_cases:
      - random_128
