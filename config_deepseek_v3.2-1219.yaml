  - name: "vllm-dp-ep"
    engine: "vllm"
    conda_env: "vllm"
    args: >
      --tensor-parallel-size 1
      --tokenizer-mode deepseek_v32
      --reasoning-parser deepseek_v3
      -dp 8
      --enable-expert-parallel
    test_cases:
      - sharegpt
      - random_32k
      - random_4k
      - random_2k
      - random_128
      - random_2k_output
  
  - name: "vllm-dp-ep-pplx"
    engine: "vllm"
    conda_env: "vllm"
    args: >
      --tensor-parallel-size 1
      --tokenizer-mode deepseek_v32
      --reasoning-parser deepseek_v3
      -dp 8
      --enable-expert-parallel
      --all2all-backend pplx
    test_cases:
      - sharegpt

  - name: "vllm-tp-dcp"
    engine: "vllm"
    conda_env: "vllm"
    args: >
      --tokenizer-mode deepseek_v32
      --reasoning-parser deepseek_v3
      -tp 8
      -dcp 8
    test_cases:
      - sharegpt
  - name: "vllm-tp-short-ctx-bf16"
    engine: "vllm"
    conda_env: "vllm"
    args: >
      --tokenizer-mode deepseek_v32
      --reasoning-parser deepseek_v3
      -tp 8
      -dcp 8
      --kv-cache-dtype bfloat16
    test_cases:
      - random_128